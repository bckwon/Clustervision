
<!doctype html>
<head>
<link rel="stylesheet" type="text/css" href="{{url_for('static', filename='css/bootstrap.min.css')}}">
<link rel="stylesheet" type="text/css" href="{{url_for('static', filename='css/bootstrap-theme.min.css')}}">
<script src="{{ url_for('static', filename='javascript/d3.min.js') }}"></script>
<script src="{{ url_for('static', filename='javascript/jquery-2.2.0.min.js') }}"></script>
<script src="{{ url_for('static', filename='javascript/bootstrap.min.js') }}"></script>
<script src="{{ url_for('static', filename='javascript/cluster_view.js') }}"></script>

<title>Cluster Analysis</title>
</head>
{% include "partials/navigation.html" ignore missing %}

<button id="initialize_session">Initialize Session with Blob</button>
<button id="clustering">Run "Clustering" with session id = 0 and user choice = 0</button>

<div class="canvas">
</div>

<script type="text/javascript">
    
    // var data = JSON.parse({{data|tojson|safe}});
    // console.log(data);

	var screen_width = window.screen.availWidth;
	var screen_height = window.screen.availHeight;
    var chosen_dataset = "blobs";
    var chosen_session_id = 0;
    var chosen_user_choice = 0;

    // Ajax Code to Send Data to Server and Receive Outcome from Server.
    $('#initialize_session').on("click", function(){
	    $.ajax({
	        type: "POST",
	        url: $SCRIPT_ROOT + "/new_session?dataset="+chosen_dataset,
	        contentType: "application/json; charset=utf-8",
	        // data: JSON.stringify({"data": data}),
	        success: function(data) {
	            var parsed_data = JSON.parse(data);
	            console.log(parsed_data);
	        }
	    });
    });

    $('#clustering').on("click", function(){
	    $.ajax({
	        type: "POST",
	        url: $SCRIPT_ROOT + "/clustering?session_id="+chosen_session_id+"&user_choice="+chosen_user_choice,
	        contentType: "application/json; charset=utf-8",
	        // data: JSON.stringify({"data": data}),
	        success: function(data) {
	            var parsed_data = JSON.parse(data);
	            console.log(parsed_data);
	            var CL = new ClusterView(".canvas", parsed_data, screen_width, screen_height);
	        }
	    });
    });


</script>
