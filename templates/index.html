    function sort_by_normalized_quality_metrics(data){
        var new_data = data.slice();

        var quality_metrics = _.without(Object.keys(data[0]["quality_metrics"]), "silhouette_clusters", "silhouette_samples", "separation_clusters", "cohesion_clusters","min_max_dist", "separation", "cohesion");

        var scale = {}
        quality_metrics.forEach(function(d){
            scale[d] = d3.scale.linear().domain(d3.extent(data, function(e){
                return parseFloat(e["quality_metrics"][d]);
            })).range([0,1]);
        });

        new_data = new_data.sort(function(a,b){
            var a_sum = 0;
            var b_sum = 0;
            quality_metrics.forEach(function(d){
                a_sum = a_sum + scale[d](a["quality_metrics"][d]);
                b_sum = b_sum + scale[d](b["quality_metrics"][d])
            });
            return d3.descending(a_sum, b_sum);
        });

        return new_data;
    }

    d3.selection.prototype.moveToFront = function() {

      });

    d3.selection.prototype.moveToBack = function() {
        return this.each(function() {
            var firstChild = this.parentNode.firstChild;
            if (firstChild) {
                this.parentNode.insertBefore(this, firstChild);
            }
        });
    };

    function addButton(div, btnname, btntype, float, disabled, id){
        var btntype = btntype || "btn btn-primary btn-xs";
        var float = float || "left";
        var disabled = disabled || false;
        var id = id || btnname;
        var btngroup = d3.select(div)
            .append("div").attr("class", "btn-group").style("float", float);
        var button = btngroup.append("button").attr("id", id).attr("class", btntype);
        button.text(btnname);
        if(disabled){
            button.attr("disabled", disabled);
        }
    }

    function setup_checkbox_list(cluster_bool, cluster_index) {
        d3.select(".canvas_middle_bottom_left").selectAll("*").remove();
        var data_desc_keys = d3.keys(session["data_description"][0]).sort();
        
        var numeric_attr = [];
        for (var i = 0; i < data_desc_keys.length; i++) {
            if(isNaN(session["data_description"][0][data_desc_keys[i]])){

            }else{
              numeric_attr.push(data_desc_keys[i]);
            }
        }

        if(cluster_bool){
            var feature_selection = session["clustering"][cluster_index]["feature_selection"];
        }

        var table_data = [];
        numeric_attr.forEach(function(d){
            if(cluster_bool){
                var obj = {};
                obj["Name"] = d;
                feature_index = feature_selection["names"].indexOf(d);
                obj["Score"] = Math.round(feature_selection["scores"][feature_index],0);
                if(isNaN(obj["Score"])){
                    obj["Score"] = 0;
                }
                if(feature_selection["pvalues"][feature_index] < .05){
                    obj["Score"] = obj["Score"].toString() + "*";
                }else{
                    obj["Score"] = obj["Score"].toString();
                }
                // obj["P-Value"] = Math.round(feature_selection["pvalues"][feature_index],-2);
                table_data.push(obj);
            }else{
                table_data.push({"Name": d});
            }
        });

        var table = new Table(".canvas_middle_bottom_left", [screen_width/10, screen_height/2.5], table_data);

        $('input.check_all').prop("checked", true);

        $('input.check_all').on("click", function(elm){
            var array = $('input.check_all:checked').map(function(){
                return $(this).val();
            })
            if(array.length > 0){
                $('input.feature_checkbox').prop("checked", true);
            }else{
                $('input.feature_checkbox').prop("checked", false);
            }
            var array = $('input.feature_checkbox:checked').map(function(){
                return $(this).val();
            })
            var table_array = table.rows.data().map(function(row_data){return row_data["Name"];});
            array = _.intersection(table_array, array);

            table.highlight_rows_by_name([]);
            table.selected_item = [];

            _s.listenerMap['checkbox_listener_for_parallel_coordinates'].fire(array);
        })

        $('input.feature_checkbox').attr("checked", "checked");

        $('input.feature_checkbox').on("click", function(elm){
            var array = $('input.feature_checkbox:checked').map(function(){
                return $(this).val();
            });
            var table_array = table.rows.data().map(function(row_data){return row_data["Name"];});
            array = _.intersection(table_array, array);
            _s.listenerMap['checkbox_listener_for_parallel_coordinates'].fire(array);
        });
        if(cluster_bool){
            table.selected_item = table_data.sort(function(a,b){return parseFloat(b["Score"])-parseFloat(a["Score"]);}).filter(function(d,i){return i < NUM_OF_ATTRS_TO_BEGIN;}).map(function(d){return d["Name"]});
            $('input.feature_checkbox').prop("checked", false);
            table.selected_item.forEach(function(item, item_index){
                $('input.feature_checkbox[value="'+item+'"]').prop("checked", true);
            })
            var k = "Score";
            table.rows.sort(function(a, b) {
                if (isNaN(parseFloat(a[k])) || isNaN(parseFloat(b[k]))) {
                    return d3.ascending(a[k], b[k]);
                } else {
                    if (+parseFloat(a[k]) > +parseFloat(b[k])) { return -1; }
                    if (+parseFloat(a[k]) < +parseFloat(b[k])) { return 1; }
                    return 0;
                }
            });

            // var array = $('input.feature_checkbox:checked').map(function(){
            //     return $(this).val();
            // })
            // var table_array = table.rows.data().map(function(row_data){return row_data["Name"];});
            // array = _.intersection(table_array, array);
            // _s.listenerMap['checkbox_listener_for_parallel_coordinates'].fire(array);

            table.selected_item = [];
        }
    }
