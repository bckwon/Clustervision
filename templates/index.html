<div class = "canvas_main">

        <div class = "canvas_middle_top"></div>
        <div class = "canvas_middle_bottom">

<script type="text/javascript">

	var screen_width = window.screen.availWidth;
	var screen_height = window.screen.availHeight;
    var chosen_dataset = "blobs";
    var chosen_session_id = 0;
    var chosen_user_choice = 0;
    var chosen_lambda = 0.5;
    var chosen_dr_method = "tsne";
    var session = {};
    var chosen_constraints = {same_cluster: [], diff_cluster: []};
    var chosen_k = [2, 20];
    // chosen_constraints["same_cluster"] = [];
    // chosen_constraints["diff_cluster"] = [];
    var sort_asc = "{{url_for('static', filename='images/sort_asc.svg')}}";
    var sort_desc = "{{url_for('static', filename='images/sort_desc.svg')}}";
	var remove_svg = "{{url_for('static', filename='images/remove.svg')}}";



    $('.dataset_item').on("click", toggle_dataset);
    $('.drt_item').on("click", toggle_drt);


    $('body').on("click", "#Rerun", function(){
        remove_all();
        start(false);
    });

    same_diff_cluster_listener = new _s.Listener("same_diff_cluster_listener");
    same_diff_cluster_listener.subscribe(update_same_diff_clusters);

    function update_same_diff_clusters(same_diff_arrays){
        chosen_constraints["same_cluster"] = [same_diff_arrays[0]];
        chosen_constraints["diff_cluster"] = [same_diff_arrays[1]];
    }

    function toggle_dataset(element){
    	chosen_dataset=$(this).attr("name");
    	remove_all();
    	session = 0;
    	session = {};
        initialize_values();
    	start(true);
        $('#dataset_dropdown_link').html('Current Dataset: <span class="dataset_title">' + chosen_dataset+'</span><span class="caret"></span>');
    }


    function toggle_drt(element){
        chosen_dr_method=$(this).attr("name");
        fetch_embedding();
        $('#drt_dropdown_link').html('Dimensionality Reduction Technique: <span class="drt_title">'+chosen_dr_method+'</span><span class="caret"></span>');
    }

    function remove_all(){
    	d3.select(".canvas_left").selectAll("*").remove();
    	d3.select(".canvas_middle_top").selectAll("*").remove();
        d3.select(".canvas_middle_bottom").selectAll("*").remove();
    	d3.select(".canvas_right").selectAll("*").remove();
    }

    start(true);

    $('#dataset_dropdown_link').html('Current Dataset: <span class="dataset_title">' + chosen_dataset+'</span><span class="caret"></span>');
    $('#drt_dropdown_link').html('Dimensionality Reduction Technique: <span class="drt_title">'+chosen_dr_method+'</span><span class="caret"></span>');

    function fetch_session() {
        $.ajax({
            type: "POST",
            url: $SCRIPT_ROOT + "/new_session?dataset="+chosen_dataset,
            contentType: "application/json; charset=utf-8",
            success: function(data) {
                var parsed_data = JSON.parse(data);
                chosen_session_id = parsed_data;
                fetch_clustering();
            }
        });
    }

    function fetch_clustering() {
        var myData = JSON.stringify({
                "session_id": chosen_session_id,
                "lambda": chosen_lambda,
                "user_choice": chosen_user_choice,
                "constraints": chosen_constraints,
                "k": chosen_k
            }, null, '\t');
        console.log('Fetching a new clustering with session_id:', chosen_session_id);
        console.log('chosen_constraints: ', chosen_constraints)
    	$.ajax({
	        type: "POST",
	        url: $SCRIPT_ROOT + "/clustering",
	        contentType: "application/json; charset=utf-8",
            data: myData,
	        success: function(data) {
	            var parsed_data = JSON.parse(data);
	            // var CL = new ClusterView(".canvas_left", parsed_data, screen_width/3, (screen_height-200));
	            // var QC = new QualityChart(".canvas_top", parsed_data, screen_width*.9, (screen_height/4.5));
	            // var CR = new ClusteringResult(".canvas_left", parsed_data, screen_width/4.5, (screen_height/4.5));
                if(parsed_data.length > 0){
                    var CR = new ClusteringStripes(".canvas_left", parsed_data, screen_width/4.5, (screen_height*8/10));
    	            var CL = new ClusterList(".canvas_right", parsed_data, screen_width/4.5, (screen_height*.8));
    	            session["clustering"] = parsed_data;

                    for (var i = 0; i < session['clustering'].length; i++) {
                        clustering = session['clustering'][i];
                    }
                    fetch_dataset();
                }else{
                    initialize_values();
                    d3.select(".canvas_left").append("div")
                        .attr("id", "no_clustering")
                        .html(function(){
                            var html = '<br><br><div class="alert alert-danger" id="no_clustering_message"><strong>No Results Found.</strong> No clustering results satisfy your constrints. Initial results with no constraints will show up in 3 seconds.</div>';
                            return html;
                        });
                    $("#no_clustering_message").fadeTo(3000, 500).slideUp(500, function(){
                        $("#no_clustering_message").slideUp(500);
                        d3.select("#no_clustering").remove();
                        fetch_clustering();
                    });

                }
	        }
	    });
    }

    function fetch_dataset() {
        console.log('Fetching dataset:', chosen_dataset);
	    $.ajax({
	        type: "GET",
	        url: $SCRIPT_ROOT + "/dataset?dataset="+chosen_dataset+"&method="+chosen_dr_method,
	        contentType: "application/json; charset=utf-8",
	        success: function(data) {
	            var parsed_data = JSON.parse(data);
	            session["data_attributes"] = parsed_data;
                fetch_description();
	        }
	    });
    }

    function fetch_description(){
        $.ajax({
            type: "GET",
            url: $SCRIPT_ROOT + "/description?dataset="+chosen_dataset,
            contentType: "application/json; charset=utf-8",
            success: function(data) {
                var parsed_data = JSON.parse(data);
                session["data_description"] = parsed_data;
                fetch_embedding();
            }
        });
    }

    function fetch_embedding() {
        $.ajax({
            type: "GET",
            url: $SCRIPT_ROOT + "/embedding?dataset="+chosen_dataset+"&method="+chosen_dr_method,
            contentType: "application/json; charset=utf-8",
            success: function(data) {
                var parsed_data = JSON.parse(data);
                session["embedding"] = parsed_data;
                load_projection();
            }
        });
    }

    function load_projection() {
        if ((session['embedding'] == null) || (session['data_attributes'] == null) || (session['clustering'] == null)) {
            window.setTimeout('load_projection();', 100);
        } else {
            var proj = new Projection(".canvas_middle_top", session, screen_width/2, screen_height/2.5);
            setup_checkbox_list();
            var pc = new ParallelCoordinates(".canvas_middle_bottom", session, screen_width/2, screen_height/2.5, sort_asc, sort_desc, remove_svg);
        }
        initialize_values();
    }

    function initialize_values(){
        // initialize values:
        chosen_constraints = {same_cluster: [], diff_cluster: []};
        chosen_user_choice = 0;
    }

    function start(new_session){
        setup_slider();
    	if(new_session) {
            fetch_session();
    	} else {
            fetch_clustering();
        }
        // fetch_dataset();
    }

    d3.selection.prototype.moveToFront = function() {
      return this.each(function(){
        this.parentNode.appendChild(this);
      });
    };

    d3.selection.prototype.moveToBack = function() {
        return this.each(function() {
            var firstChild = this.parentNode.firstChild;
            if (firstChild) {
                this.parentNode.insertBefore(this, firstChild);
            }
        });
    };

    function addInputButton(div, inputname, float, inputclass, inputid, labelbool){
        var float = float || "left";
        var labelbool = labelbool || false;
        var btngroup = d3.select(div)
            .append("div").attr("class", "btn-group")
            .attr("id", "btn-group_"+inputclass)
            .style("float", float);
        var text = btngroup.append("span").style("float", float).text(inputname + ":  ");
        var input = btngroup.append("span").style("float", float).append("input")
                    .attr("class", inputclass)
                    .attr("id", inputid)
                    .attr("type", "range")
                    .style("margin-top", 3)
                    .style("display", "inline-block")
                    .style("vertical-align", "middle");
        if(labelbool){
            addButton("#btn-group_"+inputclass, "Rerun", "btn btn-default btn-xs");
            var input_label = btngroup.append("span").style("float", float)
                            .attr("class", inputclass +"_text")
                            .attr("id", inputid+"_text");
        }
    }

    function addButton(div, btnname, btntype, float, disabled, id){
        var btntype = btntype || "btn btn-primary btn-xs";
        var float = float || "left";
        var disabled = disabled || false;
        var id = id || btnname;
        var btngroup = d3.select(div)
            .append("div").attr("class", "btn-group").style("float", float);
        var button = btngroup.append("button").attr("id", id).attr("class", btntype);
        button.text(btnname);
        if(disabled){
            button.attr("disabled", disabled);
        }
    }

    function setup_checkbox_list() {
        d3.select(".canvas_middle_bottom").selectAll("*").remove();
        var btn_group = d3.select(".canvas_middle_bottom").append("div").attr("class", "btn-group").style("position", "fixed").style("background", "white");

        var data_desc_keys = d3.keys(session["data_description"][0]).sort();

        btn_group.append("button").attr("data-toggle", "dropdown").attr("class", "btn btn-default dropdown-toggle").text("Features to Select")
            .append("span").attr("class", "caret");



        var ul = btn_group.append("ul").attr("class", "dropdown-menu scrollable-menu").attr("role", "menu");
        var li_all = ul.append("li").style("border-bottom", ".5px solid black");

        li_all.append("input").attr("type", "checkbox").attr("class", "check_all");
        li_all.append("label").text("Check/Uncheck All").style("padding-left", "10px");

        $('input.check_all').prop("checked", true);

        $('input.check_all').on("click", function(elm){
            var array = $('input.check_all:checked').map(function(){
                return $(this).val();
            })
            if(array.length > 0){
                $('input.feature_checkbox').prop("checked", true);
            }else{
                $('input.feature_checkbox').prop("checked", false);
            }
            var array = $('input.feature_checkbox:checked').map(function(){
                return $(this).val();
            })
            _s.listenerMap['checkbox_listener_for_parallel_coordinates'].fire(array);
        })

        var li  =  ul.selectAll("li.feature").data(data_desc_keys).enter().append("li").attr("class", "feature");

        li.append("input").attr("type", "checkbox").attr("class", "feature_checkbox").attr("id", function(d){return "id_"+d;}).attr("value", function(d){return d;});
        li.append("label").attr("for", function(d){return "id_"+d;}).attr("name", "name").attr("value", function(d){return d;}).text(function(d){return d;}).style("padding-left", "10px");

        $('input.feature_checkbox').attr("checked", "checked");

        $('input.feature_checkbox').on("click", function(elm){
            var array = $('input.feature_checkbox:checked').map(function(){
                return $(this).val();
            })
            _s.listenerMap['checkbox_listener_for_parallel_coordinates'].fire(array);
        })
    }

    function setup_slider(){

        var btn_group = d3.select(".canvas_left").append("div").attr("class", "lambda_scale").style("position", "fixed").style("background", "white").style("width", "100%");

        addInputButton(".lambda_scale", "Diversity-Quality ", "left", "lambda_input_slider", "lambda_input",true);

        var btn_group_k = d3.select(".canvas_left").append("div").attr("class", "k_slider").style("position", "absolute").style("top", "25px").style("background", "white").style("width", "100%");

        btn_group_k.append("div")
                    .text("Specify K: ").style("position", "absolute").style("left", "0%").style("width", "25%");
        btn_group_k.append("div").attr("id", "k_slider").style("position", "absolute").style("left", "25%").style("width", "50%").style("top", "4px");
        btn_group_k.append("div").attr("id", "k_slider_title").style("position", "absolute").style("left", "80%").style("width", "25%").style("color", "blue").text(chosen_k[0] + " - " + chosen_k[1]);

        d3.select("span.lambda_input_slider_text#lambda_input_text")
        .style("color", "blue")
        .text(chosen_lambda);

        $( "#k_slider" ).slider({
            range: true,
            min: 2,
            max: 20,
            step: 2,
            values: chosen_k,
            slide: function( event, ui ) {
                // $( "#amount" ).val( "$" + ui.values[ 0 ] + " - $" + ui.values[ 1 ] );
                d3.select('#k_slider_title').text(ui.values[0] + " - " + ui.values[1]);
                chosen_k = ui.values;
            }
        });

        var lambda_input_slider = d3.select("input.lambda_input_slider#lambda_input")
                                    .attr("value", chosen_lambda)
                                    .attr("min", 0)
                                    .attr("max", 1)
                                    .attr("step", .05)
                                    .on("input", function(d){
                                        chosen_lambda = parseFloat(d3.select(this).property("value"));
                                        d3.select("span.lambda_input_slider_text#lambda_input_text")
                                        .text(chosen_lambda);
                                    });

        $('#lambda_input').val(chosen_lambda);
    }

</script>
