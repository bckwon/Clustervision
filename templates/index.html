<script type="text/javascript">
    
    // var data = JSON.parse({{data|tojson|safe}});
    // console.log(data);

	var screen_width = window.screen.availWidth;
	var screen_height = window.screen.availHeight;
    var chosen_dataset = "blobs";
    var chosen_session_id = 0;
    var chosen_user_choice = 0;
    var chosen_dr_method = "pca";
    var session = {};

    // Ajax Code to Send Data to Server and Receive Outcome from Server.
    $('#initialize_session').on("click", function(){
	    $.ajax({
	        type: "POST",
	        url: $SCRIPT_ROOT + "/new_session?dataset="+chosen_dataset,
	        contentType: "application/json; charset=utf-8",
	        // data: JSON.stringify({"data": data}),
	        success: function(data) {
	            var parsed_data = JSON.parse(data);
	        }
	    });
    });

    $('#clustering').on("click", function(){
	    $.ajax({
	        type: "POST",
	        url: $SCRIPT_ROOT + "/clustering?session_id="+chosen_session_id+"&user_choice="+chosen_user_choice,
	        contentType: "application/json; charset=utf-8",
	        // data: JSON.stringify({"data": data}),
	        success: function(data) {
	            var parsed_data = JSON.parse(data);
	            console.log(parsed_data);
	            // var CL = new ClusterView(".canvas_left", parsed_data, screen_width/3, (screen_height-200));
	            // var QC = new QualityChart(".canvas_top", parsed_data, screen_width*.9, (screen_height/4.5));
	            var CR = new ClusteringResult(".canvas_left", parsed_data, screen_width/4.5, (screen_height/4.5));
	            var CL = new ClusterList(".canvas_right", parsed_data, screen_width/4.5, (screen_height*2/3));
	            session["clustering"] = parsed_data;
	        }
	    });
    });

    $('#embedding').on("click", function(){
	    $.ajax({
	        type: "GET",
	        url: $SCRIPT_ROOT + "/embedding?dataset="+chosen_dataset+"&method="+chosen_dr_method,
	        contentType: "application/json; charset=utf-8",
	        // data: JSON.stringify({"data": data}),
	        success: function(data) {
	            var parsed_data = JSON.parse(data);
	            session["embedding"] = parsed_data;
	        }
	    });
    });

    $('#dataset').on("click", function(){
	    $.ajax({
	        type: "GET",
	        url: $SCRIPT_ROOT + "/dataset?dataset="+chosen_dataset+"&method="+chosen_dr_method,
	        contentType: "application/json; charset=utf-8",
	        // data: JSON.stringify({"data": data}),
	        success: function(data) {
	            var parsed_data = JSON.parse(data);
	            session["data_attributes"] = parsed_data;
	            var proj = new Projection(".canvas_middle", session, screen_width/2, screen_height/2);
	        }
	    });
    });

</script>
